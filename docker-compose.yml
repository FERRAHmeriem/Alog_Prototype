services:
  backend:
    build: ./backend
    container_name: chna-backend
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8080/api
    container_name: chna-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
